[project]
name = "zotero-cli-agent"
version = "0.4.4"
description = "Zotero CLI for Claude Code — SQLite reads + Web API writes"
license = "CC-BY-NC-4.0"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.1",
    "pyzotero>=1.5",
    "pymupdf>=1.24",
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
    "markdownify>=1.2.2",
    "openai>=2.33.0",
    "requests>=2.31",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
local-embeddings = [
    "torch==2.7.1",
    "sentence-transformers>=2.7.0",
    "transformers>=4.51.0",
]
local-embeddings-cpu = [
    "torch==2.7.1",
    "sentence-transformers>=2.7.0",
    "transformers>=4.51.0",
]
local-embeddings-gpu = [
    "torch==2.7.1",
    "sentence-transformers>=2.7.0",
    "transformers>=4.51.0",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-static-i18n>=1.2",
    "mkdocs-click>=0.8",
]

[project.scripts]
zot = "zotero_cli_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zotero_cli_agent", "src/zotero_cli_workflows"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.9",
    "mypy>=1.14",
]

[tool.uv]
conflicts = [
    [
        { extra = "local-embeddings" },
        { extra = "local-embeddings-gpu" },
    ],
    [
        { extra = "local-embeddings-cpu" },
        { extra = "local-embeddings-gpu" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "local-embeddings" },
    { index = "pytorch-cpu", extra = "local-embeddings-cpu" },
    { index = "pytorch-cu118", extra = "local-embeddings-gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["zotero_cli_agent", "zotero_cli_workflows"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

