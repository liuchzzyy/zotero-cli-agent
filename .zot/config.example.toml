[default]
profile = "zotero-cil"

[profile.zotero-cil]
data_dir = "C:/Users/chengliu/Zotero"
library_id = ""
api_key = ""
semantic_scholar_api_key = ""
prefs_js_path = ""

[integrations]
crossref_mailto = ""

[output]
default_format = "table"
limit = 50

[export]
default_style = "bibtex"

[pdf]
extractor = "mineru"
mineru_token = ""

[embedding]
active = "api.gitee"

[embedding.local.cpu]
provider = "sentence_transformers"
url = ""
model = "BAAI/bge-m3"
device = "cpu"
batch_size = 8
hf_token = ""

[embedding.local.gpu]
provider = "sentence_transformers"
url = ""
model = "BAAI/bge-m3"
device = "cuda"
batch_size = 1
hf_token = ""

[embedding.api.gitee]
provider = "gitee"
url = "https://ai.gitee.com/v1"
api_key = ""
model = "bge-m3"
batch_size = 10

[embedding.api.jina]
provider = "jina"
url = "https://api.jina.ai/v1/embeddings"
api_key = ""
model = "jina-embeddings-v3"
batch_size = 10

[embedding.api.aliyun]
provider = "aliyun"
url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key = ""
model = "text-embedding-v4"
batch_size = 10

[rerank]
active = "api.gitee"

[rerank.local.bge]
provider = "bge_reranker"
model = "BAAI/bge-reranker-v2-m3"
hf_token = ""
batch_size = 4
max_length = 512

[rerank.api.gitee]
provider = "gitee"
url = "https://ai.gitee.com/v1/rerank"
api_key = ""
model = "bge-reranker-v2-m3"
batch_size = 16
max_length = 512

[ai_notes]
api_key = ""
base_url = "http://127.0.0.1:8317/v1"
model = "gpt-5.4"
reasoning_effort = "high"
pdf_input_mode = ""
api_mode = "auto"
chat_token_param = "auto"
max_extracted_chars = 180000
max_images = 24
max_image_mb = 8
